name: collect-daily

# 크롤링은 과거 데이터를 소급 수집할 수 없다. 하루 거르면 그 날치는 영구 손실이므로
# 노트북 cron 대신 Actions 로 돌린다.
on:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = KST 09:00
    - cron: "0 12 * * *"  # UTC 12:00 = KST 21:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 스냅샷으로부터 DB 재구성
        run: python scripts/load_snapshots.py

      - name: 수집
        run: python scripts/collect_daily.py

      - name: 스냅샷 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore(data): 29CM 랭킹 스냅샷 $(date -u +%Y-%m-%d)"
            git push
          fi
