<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">시계열 근거와 리즈닝의 트렌드 지속성 연구 구조</title>
<desc id="desc">고정한 맨투맨 8건의 입력을 A 정적, B 원시 이력, C 계산된 특징으로 분리한다. 이번 파일럿은 C만 Claude와 Qwen에 호출하고 네 기준선도 계산한다. 예측을 봉인한 뒤 미래 관측으로 정답을 복원하며 원본 해시가 일치해야 평가한다.</desc>
<defs>
<marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#087F72"/></marker>
<marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#315D92"/></marker>
<marker id="arrow-grey" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#A8B4C4"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#AC3F43"/></marker>
</defs>
<rect width="1440" height="1080" fill="#F6F8FC"/>
<g font-family="Malgun Gothic, Noto Sans KR, Arial, sans-serif">
