    variants: [tie, 타이, 리본]
  - canonical: 셔링
    group: 디테일
    en: shirred top
    variants: [shirring, shirred, 셔링]
  - canonical: 핀턱
    group: 디테일
    variants: [pintuck, pin tuck, 핀턱]
  - canonical: 슬릿
    group: 디테일
    en: slit top
    variants: [slit, 슬릿, 트임]
  - canonical: 백리스
    group: 디테일
