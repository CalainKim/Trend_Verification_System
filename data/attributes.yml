  - canonical: 포켓
    group: 디테일
    variants: [pocket, 포켓, 주머니]
  - canonical: 플라워
    group: 패턴
    en: floral shirt
    variants: [floral, flower, 플라워, 꽃]

  # ---- 소재와 가공 ----
  - canonical: 코튼
    group: 소재
    en: cotton tee
    variants: [cotton, 코튼, 순면]
  - canonical: 울
    group: 소재
    en: wool sweater
    variants: [wool, 울, 양모]
  - canonical: 캐시미어
    group: 소재
    en: cashmere sweater
    variants: [cashmere, 캐시미어]
  - canonical: 텐셀
    group: 소재
    en: tencel shirt
    variants: [tencel, 텐셀]
  - canonical: 슬러브
    group: 소재
    en: slub tee
    variants: [slub, 슬러브]
  - canonical: 니트
    group: 소재
    en: knit sweater
    variants: [knit, knitted, 니트]
  - canonical: 기모
    group: 가공
    en: fleece sweatshirt
    variants: [fleece, brushed, 기모, 플리스]
  - canonical: 워싱
    group: 가공
    en: washed tee
    variants: [washed, washing, 워싱]
  - canonical: 피그먼트
    group: 가공
    en: pigment dyed tee
    variants: [pigment, 피그먼트]
  - canonical: 빈티지
    group: 가공
    en: vintage tee
    variants: [vintage, distressed, 빈티지]
    # Vintage Black 처럼 뒤에 색상이 붙으면 가공이 아니라 색상 수식어다.
    not_followed_by_color: true

  # ---- 품목 ----
  - canonical: 티셔츠
    group: 품목
    # 화면이 유형으로 쓰는 말이라 검색 지수도 모은다. "t shirt" 는 그 품목만
    # 가리켜서 질의어로 안전하다.
    en: t shirt
    variants: [t shirt, tshirt, t-shirts, tee, tees, 티셔츠, 반팔티, 긴팔티, 티]
  - canonical: 셔츠
    group: 품목
    variants: [shirt, shirts, 셔츠]
  - canonical: 후드티
    group: 품목
    en: hoodie
    variants: [hoodie, hoody, hooded, hood, 후드, 후디, 후드티]
  - canonical: 맨투맨
    group: 품목
    en: sweatshirt
