<text x="60" y="1099.0" font-size="19" fill="#53677F" font-weight="400">유의: 트리거는 상승 예고가 아니다. SNS 자동 수집 확대·모델 학습·새 유료 호출은 이번 범위에 포함하지 않는다.</text>
