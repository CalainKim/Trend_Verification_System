<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="robots" content="noindex">
<title>연결 끊김 | MUSINSA TrendCheck</title>
<link rel="icon" href="/assets/pwa/icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:#0b0b0b;color:#f7f7f7;
  font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,sans-serif;font-weight:500;word-break:keep-all;
  background-image:radial-gradient(520px 420px at 15% 20%,rgba(36,94,255,.18),transparent 70%)}
.card{width:min(400px,100%);padding:32px 28px;border-radius:24px;text-align:left;
  background:linear-gradient(150deg,rgba(255,255,255,.14),rgba(255,255,255,.04)),rgba(20,20,20,.4);
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
img{width:40px;height:40px;border-radius:50%;display:block;margin-bottom:22px}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
p{margin-top:10px;font-size:15px;line-height:1.6;color:#bdbdbd}
button{margin-top:24px;width:100%;height:52px;border:0;border-radius:14px;font:inherit;font-size:16px;font-weight:700;color:#0b0b0b;
  background:linear-gradient(180deg,#fff,#e9e9e9);cursor:pointer}
button:active{transform:scale(.98)}
</style>
</head>
<body>
<main class="card">
  <img src="/assets/pwa/icon-192.png" alt="">
  <h1>인터넷에 연결되어 있지 않습니다</h1>
  <p>연결이 돌아오면 다시 시도해 주세요. 한 번 열어 본 화면은 연결이 없어도 보입니다.</p>
  <button type="button" onclick="location.reload()">다시 시도</button>
</main>
</body>
</html>
