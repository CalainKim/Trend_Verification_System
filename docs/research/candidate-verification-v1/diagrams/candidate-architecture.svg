<text x="80" y="1469.0" font-size="19" fill="#53677F" font-weight="400">권고는 확보한 근거와 판단 시점에 조건부다. 근거가 부족하면 보류하며, 새로운 관측은 다음 판단 기록으로 연결한다.</text>
