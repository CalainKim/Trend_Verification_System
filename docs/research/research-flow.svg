<path d="M640 492 L690 492 L690 332 L740 332" fill="none" stroke="#087F72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M640 492 L690 492 L690 482 L740 482" fill="none" stroke="#087F72" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
