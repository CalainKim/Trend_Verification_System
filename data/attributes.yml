    variants: [blouse, 블라우스]
  - canonical: 탱크톱
    group: 품목
    en: tank top
    variants: [tank top, tanktop, 탱크톱]
  - canonical: 폴로셔츠
    group: 품목
    en: polo shirt
    variants: [polo, 폴로, 피케]
  - canonical: 가디건
    group: 품목
    en: cardigan
    variants: [cardigan, 가디건, 카디건]
  - canonical: 럭비셔츠
    group: 품목
    en: rugby shirt
    variants: [rugby, 럭비, 럭비티, 럭비셔츠]

  # ---- 미매칭 토큰을 보고 보강한 항목 (2026-10-28) ----
  - canonical: 탑
    group: 품목
    # en 을 일부러 넣지 않는다. 한국어 "탑"은 탑(tower), 영어 "top"은 최고,
    # 상단, laptop 까지 가리키는 중의어라 검색 지수를 모으면 패션과 무관한
    # 검색이 섞인다. 이 유형은 커머스 신호로만 판단한다.
    variants: [top, tops, 탑, 톱]
  - canonical: 풀오버
    group: 품목
    en: pullover
    variants: [pullover, 풀오버]
  - canonical: 캐미솔
    group: 품목
    en: camisole
    variants: [camisole, cami, 캐미솔]
  - canonical: 코르셋
